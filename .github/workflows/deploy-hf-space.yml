name: Deploy poetry film MCP to Hugging Face Space

# Manual deploy (Actions tab -> this workflow -> Run workflow; works from the GitHub website on iPhone).
# Needs, in repo Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  : a Hugging Face *write* token (huggingface.co/settings/tokens)
#   variable HF_SPACE  : <hf-username>/<space-name> of an existing Space
# flavour "gradio" (default) = Gradio Space; free accounts may host it on ZeroGPU hardware.
# flavour "docker"           = Docker Space; Hugging Face requires a paid plan to create these.
# Only the sutoor-film/ folder is pushed. No media, footage or user files are in it.
on:
  workflow_dispatch:
    inputs:
      flavour:
        description: "gradio (free ZeroGPU) or docker (needs HF PRO)"
        default: gradio
        type: choice
        options: [gradio, docker]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Space files
        run: |
          cd sutoor-film
          if [ "${{ inputs.flavour }}" = "gradio" ]; then
            python3 - <<'EOF'
          import re
          readme = open("README.md", encoding="utf-8").read()
          body = re.sub(r"^---.*?---\n", "", readme, flags=re.S)
          front = ("---\ntitle: Arabic Poetry Film Production MCP\nemoji: 🎞️\ncolorFrom: yellow\ncolorTo: gray\n"
                   "sdk: gradio\nsdk_version: 6.32.0\napp_file: space/app.py\npinned: false\nlicense: other\n---\n")
          open("README.md", "w", encoding="utf-8").write(front + body)
          EOF
            { cat mcp/requirements.txt; echo "gradio[mcp]==6.32.0"; echo "spaces"; echo "torch"; echo "torchaudio"; } > requirements.txt
            printf "ffmpeg\nchromium\nbuild-essential\n" > packages.txt
            rm -f Dockerfile .dockerignore
          fi
      - name: Push sutoor-film/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret missing"; exit 1; }
          test -n "$HF_SPACE" || { echo "HF_SPACE variable missing"; exit 1; }
          git config user.email "actions@users.noreply.github.com"
          git config user.name "deploy-bot"
          git add -A sutoor-film && git commit -qm "Space flavour: ${{ inputs.flavour }}" || true
          git subtree split --prefix sutoor-film -b space-deploy
          user="${HF_SPACE%%/*}"
          git push --force "https://${user}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space-deploy:main
